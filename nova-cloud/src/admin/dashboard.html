<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nova Analytics Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a14; color: #e5e7eb; min-height: 100vh; }
    .header { background: linear-gradient(135deg, #1a1a2e, #2d1b69); padding: 24px 32px; border-bottom: 1px solid #8b5cf630; }
    .header h1 { font-size: 24px; background: linear-gradient(90deg, #a78bfa, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header p { color: #6b7280; font-size: 14px; margin-top: 4px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; padding: 24px 32px; max-width: 1200px; }
    .card { background: #1a1a2e; border: 1px solid #ffffff10; border-radius: 16px; padding: 24px; }
    .card .value { font-size: 36px; font-weight: 800; color: #a78bfa; }
    .card .label { font-size: 13px; color: #6b7280; margin-top: 8px; }
    .section { padding: 0 32px 32px; max-width: 1200px; }
    .section h2 { font-size: 18px; margin-bottom: 16px; color: #c4b5fd; }
    table { width: 100%; border-collapse: collapse; background: #1a1a2e; border-radius: 12px; overflow: hidden; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #ffffff08; font-size: 14px; }
    th { background: #12121f; color: #9ca3af; font-weight: 600; }
    .auth { padding: 32px; max-width: 400px; margin: 80px auto; background: #1a1a2e; border-radius: 16px; border: 1px solid #8b5cf630; }
    .auth input { width: 100%; padding: 12px; margin: 8px 0 16px; background: #0a0a14; border: 1px solid #ffffff15; border-radius: 8px; color: #fff; }
    .auth button { width: 100%; padding: 12px; background: linear-gradient(90deg, #7c3aed, #8b5cf6); border: none; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer; }
    .error { color: #f87171; font-size: 13px; margin-top: 8px; }
    .refresh { margin: 16px 32px; padding: 8px 16px; background: #8b5cf620; border: 1px solid #8b5cf640; color: #a78bfa; border-radius: 8px; cursor: pointer; font-size: 13px; }
  </style>
</head>
<body>
  <div id="auth" class="auth">
    <h2 style="margin-bottom:16px;color:#a78bfa">Nova Admin</h2>
    <p style="font-size:13px;color:#a78bfa;margin-bottom:12px">Default credentials:</p>
    <div style="background:#0a0a14;padding:8px 12px;border-radius:6px;font-size:12px;color:#9ca3af;margin-bottom:14px;border:1px dashed #8b5cf660">
      <div><b>Email:</b> admin@nova.app</div>
      <div><b>Password:</b> admin123</div>
    </div>
    <input id="email" type="email" value="admin@nova.app" placeholder="Email" />
    <input id="password" type="password" value="admin123" placeholder="Password" />
    <button onclick="login()">Sign In</button>
    <p id="authError" class="error"></p>
  </div>

  <div id="dashboard" style="display:none">
    <div class="header">
      <h1>Nova Analytics</h1>
      <p>Real-time platform metrics — Member 6 & 7 monitor here</p>
    </div>
    <button class="refresh" onclick="loadStats()">↻ Refresh</button>
    <div class="grid" id="stats"></div>
    <div class="section">
      <h2>API Health</h2>
      <table>
        <tr><th>Service</th><th>Status</th><th>URL</th></tr>
        <tr><td>Nova Cloud API</td><td id="apiStatus">—</td><td>/health</td></tr>
        <tr><td>WebSocket Sync</td><td>Active</td><td>/ws/sync</td></tr>
        <tr><td>Search API</td><td>Active</td><td>/api/search/query</td></tr>
      </table>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('nova_admin_token');

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, deviceName: 'Nova Admin' })
      });
      const data = await res.json();
      if (data.accessToken) {
        token = data.accessToken;
        localStorage.setItem('nova_admin_token', token);
        showDashboard();
      } else {
        document.getElementById('authError').textContent = data.error || 'Login failed';
      }
    }

    async function loadStats() {
      const res = await fetch('/api/feedback/analytics', {
        headers: { Authorization: 'Bearer ' + token }
      });
      if (!res.ok) { logout(); return; }
      const d = await res.json();
      document.getElementById('stats').innerHTML = [
        ['Total Users', d.activeUsers],
        ['Searches (7d)', d.searchesLast7d],
        ['Crashes (7d)', d.crashesLast7d],
        ['AI Usage (7d)', d.aiUsageLast7d],
        ['Feedback (7d)', d.feedbackLast7d]
      ].map(([label, val]) => `<div class="card"><div class="value">${val ?? 0}</div><div class="label">${label}</div></div>`).join('');
    }

    async function checkHealth() {
      try {
        const r = await fetch('/health');
        const d = await r.json();
        document.getElementById('apiStatus').textContent = d.status === 'ok' ? '✅ OK' : '⚠️ Degraded';
      } catch { document.getElementById('apiStatus').textContent = '❌ Down'; }
    }

    function showDashboard() {
      document.getElementById('auth').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadStats();
      checkHealth();
    }

    function logout() {
      localStorage.removeItem('nova_admin_token');
      token = null;
      location.reload();
    }

    if (token) showDashboard();
  </script>
</body>
</html>
